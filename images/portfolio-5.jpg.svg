<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a40;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#grad1)" />
  
  <!-- Fitness App Elements -->
  <rect x="300" y="100" width="200" height="400" rx="20" fill="#333" />
  <rect x="310" y="120" width="180" height="360" rx="10" fill="#111" />
  
  <!-- App Screen Elements -->
  <rect x="330" y="150" width="140" height="30" rx="5" fill="#00f7c3" opacity="0.7" />
  
  <!-- Activity Chart -->
  <polyline points="330,300 350,280 370,290 390,260 410,240 430,250 450,220 470,230" 
            stroke="#ff4d94" stroke-width="3" fill="none" />
  
  <!-- Circular Progress -->
  <circle cx="400" cy="220" r="40" fill="none" stroke="#6e42ff" stroke-width="8" opacity="0.6" />
  <path d="M400,180 A40,40 0 0 1 435,205" stroke="#00f7c3" stroke-width="8" fill="none" />
  <text x="400" y="225" font-family="Arial" font-size="16" fill="#ffffff" text-anchor="middle">75%</text>
  
  <!-- Menu Icons -->
  <rect x="340" y="350" width="30" height="30" rx="5" fill="#6e42ff" opacity="0.5" />
  <rect x="385" y="350" width="30" height="30" rx="5" fill="#ff4d94" opacity="0.5" />
  <rect x="430" y="350" width="30" height="30" rx="5" fill="#00f7c3" opacity="0.5" />
  
  <rect x="330" y="400" width="140" height="20" rx="5" fill="#ffffff" opacity="0.1" />
  
  <text x="400" y="70" font-family="Arial" font-size="24" fill="#ffffff" text-anchor="middle">Fitness App</text>
</svg>