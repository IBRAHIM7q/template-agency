  <path d="M260,240 Q300,280 340,240" stroke="#ffffff" stroke-width="5" fill="none" opacity="0.8" />
  
  <text x="300" y="400" font-family="Arial" font-size="24" fill="#ffffff" text-anchor="middle">Marketing Specialist</text>
